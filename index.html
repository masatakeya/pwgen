<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>pwgen — Password Generator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e2e5eb;
    --accent: #2563eb;
    --accent-light: #eff4ff;
    --accent-hover: #1d4ed8;
    --success: #059669;
    --success-light: #ecfdf5;
    --text: #111827;
    --text-2: #4b5563;
    --text-3: #9ca3af;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
    --hover-border: #93c5fd;
    --accent-hover-bg: #dbeafe;
    --row-hover: #fafbff;
    --toast-bg: #111827;
    --toast-text: #ffffff;
    --c-upper: #2563eb;
    --c-lower: #111827;
    --c-digit: #d97706;
    --c-symbol: #dc2626;
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #181b22;
      --border: #2c313c;
      --accent: #60a5fa;
      --accent-light: #1e293b;
      --accent-hover: #3b82f6;
      --success: #34d399;
      --success-light: #064e3b;
      --text: #f3f4f6;
      --text-2: #c2c7d0;
      --text-3: #8b93a1;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
      --hover-border: #3b82f6;
      --accent-hover-bg: #253247;
      --row-hover: #1d212a;
      --toast-bg: #f3f4f6;
      --toast-text: #111827;
      --c-upper: #60a5fa;
      --c-lower: #f3f4f6;
      --c-digit: #fbbf24;
      --c-symbol: #f87171;
    }
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  .container {
    width: 100%;
    max-width: 560px;
  }

  header {
    margin-bottom: 36px;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  h1 {
    font-family: var(--sans);
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 15px;
    color: var(--text-2);
    line-height: 1.6;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
    margin-bottom: 16px;
  }

  .section-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 16px;
  }

  .slider-group {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 28px;
  }

  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .slider-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .slider-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .slider-val {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    background: var(--surface);
    border: 3px solid var(--accent);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(37,99,235,0.25);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    box-shadow: 0 4px 16px rgba(37,99,235,0.35);
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 -28px 24px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 28px;
  }

  .option {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }

  .option:has(input:focus-visible) {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .option:hover {
    border-color: var(--hover-border);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.07);
  }

  .option.checked {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .check-icon {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, background 0.15s;
    background: var(--surface);
  }

  .option.checked .check-icon {
    border-color: var(--accent);
    background: var(--accent);
  }

  .check-icon svg { display: none; }
  .option.checked .check-icon svg { display: block; }

  .option-info { flex: 1; min-width: 0; }

  .option-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .option-sample {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-3);
    margin-top: 2px;
  }

  .generate-btn {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 4px 14px rgba(37,99,235,0.30);
  }

  .generate-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .generate-btn:hover {
    background: var(--accent-hover);
    box-shadow: 0 6px 20px rgba(37,99,235,0.38);
  }

  .generate-btn:active { transform: scale(0.99); }

  .results-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
  }

  .results-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-2);
  }

  .copy-all-btn {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    border: none;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .copy-all-btn:hover:not(:disabled) { background: var(--accent-hover-bg); }

  .copy-all-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .results-list {
    max-height: 380px;
    overflow-y: auto;
  }

  .results-list::-webkit-scrollbar { width: 4px; }
  .results-list::-webkit-scrollbar-track { background: transparent; }
  .results-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .pw-row {
    display: flex;
    align-items: center;
    padding: 12px 24px;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  .pw-row:last-child { border-bottom: none; }
  .pw-row:hover { background: var(--row-hover); }

  .pw-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-3);
    width: 18px;
    flex-shrink: 0;
    text-align: right;
  }

  .pw-text {
    flex: 1;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.06em;
    color: var(--text);
    word-break: break-all;
  }

  .c-upper { color: var(--c-upper); }
  .c-lower { color: var(--c-lower); }
  .c-digit { color: var(--c-digit); }
  .c-symbol { color: var(--c-symbol); }

  .pw-copy-btn {
    flex-shrink: 0;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-3);
    background: none;
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s, border-color 0.15s, background 0.15s;
  }

  .pw-row:hover .pw-copy-btn,
  .pw-copy-btn:focus-visible { opacity: 1; }

  /* タッチ端末ではホバーできないので常に表示 */
  @media (hover: none) {
    .pw-copy-btn { opacity: 1; }
  }

  .pw-row.copied .pw-copy-btn {
    opacity: 1;
    color: var(--success);
    border-color: var(--success);
    background: var(--success-light);
  }

  .entropy-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--row-hover);
  }

  .entropy-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-3);
    white-space: nowrap;
  }

  .entropy-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .entropy-fill {
    height: 100%;
    border-radius: 999px;
    width: 0%;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1), background 0.4s;
  }

  .entropy-text {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    min-width: 100px;
    text-align: right;
  }

  .empty-state {
    padding: 48px 24px;
    text-align: center;
    color: var(--text-3);
    font-size: 14px;
    line-height: 1.6;
  }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--toast-bg);
    color: var(--toast-text);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 999px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
    box-shadow: var(--shadow-lg);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 480px) {
    .card { padding: 20px; }
    .divider { margin: 0 -20px 20px; }
    .entropy-row { flex-wrap: wrap; justify-content: space-between; row-gap: 10px; }
    .entropy-bar { order: 1; flex-basis: 100%; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">
      <span class="badge-dot"></span>
      ブラウザ完結・サーバー送信なし
    </div>
    <h1>パスワード生成ツール</h1>
    <p class="subtitle">安全な乱数を使って、強力なパスワードをすばやく作れます。</p>
  </header>

  <div class="card">
    <div class="section-label">設定</div>

    <div class="slider-group">
      <div class="slider-row">
        <div class="slider-top">
          <span class="slider-name">パスワードの長さ</span>
          <span class="slider-val" id="lengthValue">16</span>
        </div>
        <input type="range" id="lengthSlider" min="4" max="64" value="16">
      </div>
      <div class="slider-row">
        <div class="slider-top">
          <span class="slider-name">生成する件数</span>
          <span class="slider-val" id="countValue">8</span>
        </div>
        <input type="range" id="countSlider" min="1" max="20" value="8">
      </div>
    </div>

    <div class="divider"></div>

    <div class="section-label">使用する文字の種類</div>
    <div class="options-grid">
      <label class="option checked" id="opt-upper">
        <div class="check-icon">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="option-info">
          <div class="option-name">大文字</div>
          <div class="option-sample">A B C … Z</div>
        </div>
        <input type="checkbox" class="sr-only" checked data-key="upper">
      </label>
      <label class="option checked" id="opt-lower">
        <div class="check-icon">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="option-info">
          <div class="option-name">小文字</div>
          <div class="option-sample">a b c … z</div>
        </div>
        <input type="checkbox" class="sr-only" checked data-key="lower">
      </label>
      <label class="option checked" id="opt-digit">
        <div class="check-icon">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="option-info">
          <div class="option-name">数字</div>
          <div class="option-sample">0 1 2 … 9</div>
        </div>
        <input type="checkbox" class="sr-only" checked data-key="digit">
      </label>
      <label class="option" id="opt-symbol">
        <div class="check-icon">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="option-info">
          <div class="option-name">記号</div>
          <div class="option-sample">! @ # $ % …</div>
        </div>
        <input type="checkbox" class="sr-only" data-key="symbol">
      </label>
    </div>

    <div class="entropy-row">
      <span class="entropy-label">この設定の強度</span>
      <div class="entropy-bar"><div class="entropy-fill" id="entropyFill"></div></div>
      <span class="entropy-text" id="entropyText"></span>
    </div>

    <button type="button" class="generate-btn" id="generateBtn">パスワードを生成する</button>
  </div>

  <div class="results-card">
    <div class="results-header">
      <span class="results-title">生成結果</span>
      <button type="button" class="copy-all-btn" id="copyAllBtn" disabled>すべてコピー</button>
    </div>
    <div class="results-list" id="resultsList" aria-live="polite">
      <div class="empty-state">設定を確認してから「パスワードを生成する」を押すと、<br>ここにパスワードが表示されます。</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const CHARS = {
    upper:  'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower:  'abcdefghijklmnopqrstuvwxyz',
    digit:  '0123456789',
    symbol: '!@#$%^&*()-_=+[]{}|;:,.<>?'
  };
  const KEYS = ['upper', 'lower', 'digit', 'symbol'];

  const lengthSlider = document.getElementById('lengthSlider');
  const lengthValue  = document.getElementById('lengthValue');
  const countSlider  = document.getElementById('countSlider');
  const countValue   = document.getElementById('countValue');
  const generateBtn  = document.getElementById('generateBtn');
  const resultsList  = document.getElementById('resultsList');
  const copyAllBtn   = document.getElementById('copyAllBtn');
  const entropyFill  = document.getElementById('entropyFill');
  const entropyText  = document.getElementById('entropyText');
  const toast        = document.getElementById('toast');
  const optionInputs = [...document.querySelectorAll('.option input[type=checkbox]')];

  // 0 以上 max 未満の一様な整数。剰余による偏りを避けるため、端数の範囲に入った値は捨てて引き直す
  function randomInt(max) {
    const limit = Math.floor(0x100000000 / max) * max;
    const buf = new Uint32Array(1);
    do {
      crypto.getRandomValues(buf);
    } while (buf[0] >= limit);
    return buf[0] % max;
  }

  function getOptions() {
    return Object.fromEntries(optionInputs.map(i => [i.dataset.key, i.checked]));
  }

  function selectedSets(opts) {
    return KEYS.filter(k => opts[k]).map(k => CHARS[k]);
  }

  // 選んだ文字をすべて同じ確率で使い、選んだ種類が1文字ずつ以上入るまで作り直す。
  // こうすると「全種類を含むパスワード」全体から一様に選ばれ、特定の位置や文字に偏らない
  function generatePassword(length, opts) {
    const sets = selectedSets(opts);
    const pool = sets.join('');
    const mustCover = length >= sets.length;
    for (;;) {
      let pw = '';
      for (let i = 0; i < length; i++) pw += pool[randomInt(pool.length)];
      if (!mustCover || sets.every(set => [...pw].some(ch => set.includes(ch)))) return pw;
    }
  }

  // 生成され得るパスワードの数（全種類を含むものだけ）を包除原理で数え、その log2 をビット数とする
  function calcEntropy(length, opts) {
    const sizes = selectedSets(opts).map(s => s.length);
    const total = sizes.reduce((a, b) => a + b, 0);
    let ratio = 1;
    if (length >= sizes.length) {
      ratio = 0;
      for (let mask = 0; mask < 1 << sizes.length; mask++) {
        let missing = 0, n = 0;
        sizes.forEach((s, i) => { if (mask >> i & 1) { missing += s; n++; } });
        ratio += (n % 2 ? -1 : 1) * Math.pow(1 - missing / total, length);
      }
    }
    return Math.floor(length * Math.log2(total) + Math.log2(ratio));
  }

  function updateEntropy() {
    const bits = calcEntropy(parseInt(lengthSlider.value), getOptions());
    const pct = Math.min(100, Math.round(bits / 128 * 100));
    let label, color;
    if (bits < 40)      { label = '弱い';       color = '#ef4444'; }
    else if (bits < 64) { label = '普通';       color = '#f59e0b'; }
    else if (bits < 96) { label = '強い';       color = '#10b981'; }
    else                { label = '非常に強い'; color = '#3b82f6'; }
    entropyFill.style.width = pct + '%';
    entropyFill.style.background = color;
    entropyText.style.color = color;
    entropyText.textContent = `${bits} bit · ${label}`;
  }

  lengthSlider.addEventListener('input', () => {
    lengthValue.textContent = lengthSlider.value;
    updateEntropy();
  });
  countSlider.addEventListener('input', () => countValue.textContent = countSlider.value);

  optionInputs.forEach(input => {
    input.addEventListener('change', () => {
      if (!optionInputs.some(i => i.checked)) {
        input.checked = true;
        showToast('文字の種類は1つ以上選んでください');
      }
      input.closest('.option').classList.toggle('checked', input.checked);
      updateEntropy();
    });
  });

  function charClass(ch) {
    if (/[A-Z]/.test(ch)) return 'c-upper';
    if (/[a-z]/.test(ch)) return 'c-lower';
    if (/[0-9]/.test(ch)) return 'c-digit';
    return 'c-symbol';
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  let passwords = [];

  function generate() {
    const length = parseInt(lengthSlider.value);
    const count  = parseInt(countSlider.value);
    const opts   = getOptions();

    passwords = Array.from({ length: count }, () => generatePassword(length, opts));

    // innerHTML を使わず textContent で組み立てる（記号の < や & がHTMLとして解釈されない）
    resultsList.replaceChildren(...passwords.map((pw, i) => {
      const row  = el('div', 'pw-row');
      const text = el('span', 'pw-text');
      for (const ch of pw) text.append(el('span', charClass(ch), ch));
      const btn = el('button', 'pw-copy-btn', 'コピー');
      btn.type = 'button';
      btn.setAttribute('aria-label', `${i + 1}番目のパスワードをコピー`);
      btn.addEventListener('click', () => copyRow(row, pw));
      row.append(el('span', 'pw-num', String(i + 1)), text, btn);
      return row;
    }));
    copyAllBtn.disabled = false;
  }

  function copyRow(row, pw) {
    navigator.clipboard.writeText(pw).then(() => {
      document.querySelectorAll('.pw-row').forEach(r => {
        r.classList.remove('copied');
        r.querySelector('.pw-copy-btn').textContent = 'コピー';
      });
      row.classList.add('copied');
      row.querySelector('.pw-copy-btn').textContent = '✓ 完了';
      setTimeout(() => {
        row.classList.remove('copied');
        row.querySelector('.pw-copy-btn').textContent = 'コピー';
      }, 2000);
    }, () => showToast('コピーできませんでした'));
  }

  copyAllBtn.addEventListener('click', () => {
    if (!passwords.length) return;
    navigator.clipboard.writeText(passwords.join('\n')).then(
      () => showToast('すべてのパスワードをコピーしました'),
      () => showToast('コピーできませんでした')
    );
  });

  generateBtn.addEventListener('click', generate);

  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  // 安全な乱数が使えない環境では生成させない
  if (!window.crypto || !crypto.getRandomValues) {
    generateBtn.disabled = true;
    generateBtn.textContent = 'このブラウザでは安全な乱数が使えません';
  }

  updateEntropy();
</script>
</body>
</html>
